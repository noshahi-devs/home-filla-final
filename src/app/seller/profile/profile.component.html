<div class="properties-page">
  <div class="page-header" style="margin-bottom: 2rem;">
    <div>
      <h1>My Profile</h1>
      <p class="page-subtitle">Update your personal information, agency details, and public profile.</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary" (click)="saveProfile()">
        <i class="fas fa-save"></i> Save Changes
      </button>
    </div>
  </div>

  <div style="background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);">
    
    <!-- Profile Header Banner -->
    <div style="height: 120px; background: linear-gradient(135deg, #f0fdfa, #ccfbf1); position: relative; border-bottom: 1px solid #e2e8f0;">
      <div style="position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: radial-gradient(circle, rgba(20,184,166,0.1) 0%, rgba(0,0,0,0) 70%); border-radius: 50%;"></div>
    </div>

    <div style="padding: 0 2.5rem 2.5rem; position: relative;">
      
      <!-- Avatar Section -->
      <div style="display: flex; flex-wrap: wrap; gap: 2rem; align-items: center; margin-bottom: 2.5rem;">
        <div style="position: relative; width: 120px; height: 120px; border-radius: 50%; padding: 4px; background: #ffffff; box-shadow: 0 8px 25px rgba(15,23,42,0.1); margin-top: -60px;">
          <img [src]="profile.avatar" alt="Profile" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #f1f5f9;">
          <div style="position: absolute; bottom: 4px; right: 4px; width: 32px; height: 32px; background: #14b8a6; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; font-size: 0.85rem; cursor: pointer;">
            <i class="fas fa-camera"></i>
          </div>
        </div>
        
        <div style="flex: 1; min-width: 280px;">
          <label class="field-label" style="display: block; margin-bottom: 8px;">Profile Image URL</label>
          <input type="text" class="field-input" [(ngModel)]="profile.avatar" placeholder="https://..." style="width: 100%;">
        </div>
      </div>

      <hr style="border: none; border-top: 1.5px solid #f1f5f9; margin: 0 0 2.5rem;">

      <!-- Form Grid -->
      <div class="form-grid">
        
        <!-- Personal Info -->
        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
          <h3 style="margin: 0; font-size: 1.1rem; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-user-circle" style="color: #14b8a6;"></i> Personal Details
          </h3>
          
          <div>
            <label class="field-label">Full Name</label>
            <input type="text" class="field-input" [(ngModel)]="profile.name" placeholder="John Doe">
          </div>
          
          <div>
            <label class="field-label">Email Address <span style="font-size: 0.75rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; margin-left: 6px;">(Read-only)</span></label>
            <div style="position: relative;">
              <i class="fas fa-envelope" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
              <input type="email" class="field-input" [(ngModel)]="profile.email" disabled style="padding-left: 40px; background: #f8fafc; color: #64748b; cursor: not-allowed; border-color: #e2e8f0;">
            </div>
          </div>

          <div>
            <label class="field-label">Phone Number</label>
            <div style="position: relative;">
              <i class="fas fa-phone" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
              <input type="text" class="field-input" [(ngModel)]="profile.phone" placeholder="+1 (555) 000-0000" style="padding-left: 40px;">
            </div>
          </div>
        </div>

        <!-- Professional Info -->
        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
          <h3 style="margin: 0; font-size: 1.1rem; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-briefcase" style="color: #f59e0b;"></i> Professional Info
          </h3>
          
          <div>
            <label class="field-label">Agency Name (Optional)</label>
            <div style="position: relative;">
              <i class="fas fa-building" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
              <input type="text" class="field-input" [(ngModel)]="profile.agency" placeholder="Realty Group LLC" style="padding-left: 40px;">
            </div>
          </div>

          <div style="flex: 1; display: flex; flex-direction: column;">
            <label class="field-label">About You (Bio)</label>
            <textarea class="field-input" rows="5" [(ngModel)]="profile.about" placeholder="Tell buyers about your experience, expertise, and what areas you cover..." style="resize: vertical; flex: 1; min-height: 120px; line-height: 1.6;"></textarea>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<style>
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
}

@media (max-width: 768px) {
  .form-grid {
    grid-template-columns: 1fr;
    gap: 2.5rem;
  }
  
  .page-header {
    flex-direction: column;
    align-items: flex-start !important;
  }
  
  .page-header .header-actions {
    width: 100%;
  }
  
  .page-header .btn-primary {
    width: 100%;
    justify-content: center;
  }
}

@media (max-width: 480px) {
  .properties-page > div:not(.page-header) > div:last-child {
    padding: 0 1.5rem 1.5rem !important;
  }
}
</style>
