<div class="properties-page">
  <!-- Page Header -->
  <div class="page-header" style="margin-bottom: 2rem;">
    <div>
      <h1>Notifications</h1>
      <p class="page-subtitle">Stay updated with your property inquiries, status updates, and platform alerts.</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary" (click)="markAllAsRead()" style="background: #ffffff; color: #14b8a6; border: 1.5px solid #14b8a6; box-shadow: 0 4px 10px rgba(20,184,166,0.1);">
        <i class="fas fa-check-double"></i> Mark all as read
      </button>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div style="margin-bottom: 2rem; display: inline-flex; border-radius: 10px; border: 1.5px solid #e2e8f0; padding: 4px; background: #f1f5f9; gap: 4px;">
    <button (click)="setFilter('all')" 
            [ngStyle]="{'background': filter === 'all' ? '#ffffff' : 'transparent', 'color': filter === 'all' ? '#0f172a' : '#64748b', 'box-shadow': filter === 'all' ? '0 2px 6px rgba(15,23,42,0.06)' : 'none'}"
            style="border: none; border-radius: 6px; padding: 6px 18px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: all 0.2s;">
      All
    </button>
    <button (click)="setFilter('unread')" 
            [ngStyle]="{'background': filter === 'unread' ? '#ffffff' : 'transparent', 'color': filter === 'unread' ? '#0f172a' : '#64748b', 'box-shadow': filter === 'unread' ? '0 2px 6px rgba(15,23,42,0.06)' : 'none'}"
            style="border: none; border-radius: 6px; padding: 6px 18px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: all 0.2s;">
      Unread
    </button>
  </div>

  <!-- Notifications List -->
  <div style="display: flex; flex-direction: column; gap: 1rem;" *ngIf="(notifications$ | async) as notifs">
    
    <div *ngFor="let n of notifs; let i = index" 
         style="background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 20px; padding: 1.5rem; display: flex; gap: 1.5rem; position: relative; transition: all 0.3s; animation: fadeIn 0.4s ease-out forwards;"
         [style.animation-delay]="(i * 0.05) + 's'"
         [ngStyle]="{'border-color': !n.isRead ? 'rgba(20,184,166,0.4)' : '#e2e8f0', 'box-shadow': !n.isRead ? '0 10px 25px rgba(20,184,166,0.08)' : '0 4px 15px rgba(15,23,42,0.02)'}">
      
      <div style="width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0;" 
           [style.background]="n.color === 'warning' ? 'rgba(245,158,11,0.1)' : n.color === 'success' ? 'rgba(34,197,94,0.1)' : n.color === 'danger' ? 'rgba(239,68,68,0.1)' : 'rgba(20,184,166,0.1)'"
           [style.color]="n.color === 'warning' ? '#f59e0b' : n.color === 'success' ? '#22c55e' : n.color === 'danger' ? '#ef4444' : '#14b8a6'">
        <i [class]="getIconClass(n.icon)"></i>
      </div>

      <div style="flex: 1;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; flex-wrap: wrap; gap: 10px;">
          <h3 style="font-size: 1.1rem; font-weight: 800; color: #0f172a; margin: 0;">{{ n.title }}</h3>
          <span style="font-size: 0.8rem; font-weight: 700; color: #94a3b8; display: flex; align-items: center; gap: 6px;"><i class="far fa-clock"></i> {{ n.createdAt | date: 'MMM d, h:mm a' }}</span>
        </div>
        <p style="color: #475569; font-size: 0.95rem; line-height: 1.5; margin: 0 0 1rem;">{{ n.message }}</p>
        
        <div *ngIf="!n.isRead">
          <button (click)="markAsRead(n.id)" style="background: transparent; border: none; padding: 0; font-size: 0.85rem; font-weight: 800; color: #14b8a6; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.2s;">
            <i class="fas fa-check"></i> Mark as Read
          </button>
        </div>
      </div>
      
      <div *ngIf="!n.isRead" style="position: absolute; top: 1.5rem; right: 1.5rem; width: 10px; height: 10px; background: #14b8a6; border-radius: 50%; box-shadow: 0 0 0 4px rgba(20,184,166,0.2);"></div>
    </div>

    <!-- Empty State -->
    <div *ngIf="notifs.length === 0" style="text-align: center; padding: 5rem 2rem; background: #ffffff; border-radius: 24px; border: 1.5px dashed #cbd5e1; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
      <div style="width: 80px; height: 80px; background: #f8fafc; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: #cbd5e1;">
        <i class="fas fa-bell-slash"></i>
      </div>
      <h3 style="font-size: 1.5rem; color: #0f172a; margin: 0; font-weight: 900;">All Caught Up!</h3>
      <p style="color: #64748b; max-width: 350px; margin: 0; font-size: 0.95rem;">You have no new notifications right now. We'll alert you here when something important happens.</p>
    </div>
  </div>
</div>

<style>
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
