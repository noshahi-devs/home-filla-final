<div class="profile-page">
  <!-- Profile Header with Cover Photo -->
  <header class="profile-header">
    <div class="cover-container">
      <img [src]="profile.coverImage" class="cover-image" alt="Cover">
      <div class="cover-overlay"></div>
      <button class="btn-edit-cover">
        <i class="fas fa-camera"></i> Change Cover
      </button>
    </div>

    <div class="profile-info-bar">
      <div class="avatar-wrapper">
        <img [src]="profile.avatar" class="profile-avatar" alt="Avatar">
        <button class="btn-change-avatar" title="Change Avatar">
          <i class="fas fa-pencil-alt"></i>
        </button>
      </div>

      <div class="user-meta-header">
        <h1 class="user-name-large">{{ profile.name }}</h1>
        <div class="user-role-badge">
          <i class="fas fa-shield-alt"></i> Verified Buyer
        </div>
      </div>
    </div>
  </header>

  <div class="profile-content-grid">
    <!-- Sidebar -->
    <aside class="stats-sidebar">
      <div class="info-card">
        <h4>About Me</h4>
        <p class="bio-text">{{ profile.bio }}</p>
        
        <div class="contact-info-list">
          <div class="contact-item">
            <i class="fas fa-envelope"></i>
            <span>{{ profile.email }}</span>
          </div>
          <div class="contact-item">
            <i class="fas fa-phone"></i>
            <span>{{ profile.phone }}</span>
          </div>
          <div class="contact-item">
            <i class="fas fa-map-marker-alt"></i>
            <span>{{ profile.address }}</span>
          </div>
        </div>
      </div>

      <div class="info-card">
        <h4>Account Status</h4>
        <div class="contact-info-list">
          <div class="contact-item">
            <i class="fas fa-check-circle" style="color: #10b981;"></i>
            <span>Email Verified</span>
          </div>
          <div class="contact-item">
            <i class="fas fa-user-check" style="color: #2563eb;"></i>
            <span>Buyer Identity Verified</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Form Area -->
    <main class="main-profile-area">
      <nav class="tabs-nav">
        <button class="tab-link" [class.active]="activeTab === 'personal'" (click)="activeTab = 'personal'">Personal Details</button>
        <button class="tab-link" [class.active]="activeTab === 'account'" (click)="activeTab = 'account'">Account Security</button>
        <button class="tab-link" [class.active]="activeTab === 'preferences'" (click)="activeTab = 'preferences'">Preferences</button>
      </nav>

      <div class="tab-content" *ngIf="activeTab === 'personal'">
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Full Name</label>
            <div class="input-wrapper">
              <i class="fas fa-user"></i>
              <input type="text" [(ngModel)]="profile.name" placeholder="Enter your full name">
            </div>
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope"></i>
              <input type="email" [(ngModel)]="profile.email" disabled>
            </div>
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <div class="input-wrapper">
              <i class="fas fa-phone"></i>
              <input type="text" [(ngModel)]="profile.phone">
            </div>
          </div>

          <div class="form-group full-width">
            <label>Address</label>
            <div class="input-wrapper">
              <i class="fas fa-map-marker-alt"></i>
              <input type="text" [(ngModel)]="profile.address">
            </div>
          </div>

          <div class="form-group full-width">
            <label>Short Bio</label>
            <textarea [(ngModel)]="profile.bio" placeholder="Tell agents what you are looking for..."></textarea>
          </div>
        </div>

        <button class="btn-save-premium" (click)="saveProfile()">
          <i class="fas fa-save"></i> Save Changes
        </button>
      </div>

      <div class="tab-content" *ngIf="activeTab === 'account'">
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Current Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock"></i>
              <input type="password" placeholder="••••••••">
            </div>
          </div>
          <div class="form-group">
            <label>New Password</label>
            <div class="input-wrapper">
              <i class="fas fa-key"></i>
              <input type="password" placeholder="Min 8 characters">
            </div>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-wrapper">
              <i class="fas fa-key"></i>
              <input type="password" placeholder="Repeat new password">
            </div>
          </div>
        </div>
        <button class="btn-save-premium">
          Update Password
        </button>
      </div>

      <div class="tab-content" *ngIf="activeTab === 'preferences'">
        <div class="form-grid">
           <p style="color: #64748b; font-size: 14px;">Your property preferences and saved search alerts can be managed here.</p>
        </div>
      </div>
    </main>
  </div>
</div>
