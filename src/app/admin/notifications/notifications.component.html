<div class="notifications-container">
  <!-- Page Header -->
  <header class="page-header">
    <div class="header-content">
      <h1>🔔 Notifications</h1>
      <p class="page-subtitle">Stay updated with the latest inquiries, payments, and system alerts.</p>
    </div>
    <div class="header-actions">
      <button class="btn-mark-all" (click)="markAllAsRead()">
        <i class="fas fa-check-double"></i> Mark all as read
      </button>
    </div>
  </header>

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <button class="tab-btn" [class.active]="filter === 'all'" (click)="setFilter('all')">
      All Notifications
    </button>
    <button class="tab-btn" [class.active]="filter === 'unread'" (click)="setFilter('unread')">
      Unread Only
    </button>
  </div>

  <!-- Notifications List -->
  <div class="notifications-list" *ngIf="(notifications$ | async) as notifs">
    <ng-container *ngIf="notifs.length > 0; else emptyState">
      <div *ngFor="let n of notifs" class="notification-item" [class.unread]="!n.isRead">
        <!-- Icon Section -->
        <div class="item-icon-wrap" [style.background]="getColorStyle(n.color) + '22'" [style.color]="getColorStyle(n.color)">
          <i [class]="getIconClass(n.icon)"></i>
        </div>

        <!-- Content Section -->
        <div class="item-content">
          <h3 class="item-title">{{ n.title }}</h3>
          <p class="item-message">{{ n.message }}</p>
          <div class="item-meta">
            <span class="item-time"><i class="far fa-clock"></i> {{ n.createdAt | date:'medium' }}</span>
            <span *ngIf="!n.isRead" class="unread-indicator"><i class="fas fa-circle"></i> New</span>
          </div>
        </div>

        <!-- Action Section -->
        <div class="item-actions" *ngIf="!n.isRead">
          <button class="btn-action" title="Mark as read" (click)="markAsRead(n.id)">
            <i class="fas fa-check"></i>
          </button>
        </div>
      </div>
    </ng-container>

    <!-- Empty State -->
    <ng-template #emptyState>
      <div class="empty-state">
        <div class="empty-icon"><i class="fas fa-bell-slash"></i></div>
        <h3>No Notifications Found</h3>
        <p>You're all caught up! There are no notifications to display in this category.</p>
      </div>
    </ng-template>
  </div>
</div>
