<div class="admin-shell" [class.sidebar-collapsed]="sidebarCollapsed" (click)="closeDropdowns()">

  <!-- Mobile Overlay -->
  <div class="sidebar-overlay" *ngIf="sidebarCollapsed" (click)="toggleSidebar()"></div>

  <!-- ── Sidebar ───────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a routerLink="/admin/properties" class="sidebar-logo" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 70px; text-decoration: none;">
        <img src="/homefilla-logo.png" alt="Home Filla" style="width: 100%; height: 100%; object-fit: contain;" />
      </a>
    </div>

    <div class="sidebar-label">MAIN MENU</div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of menuItems" [routerLink]="item.route" class="nav-item" [class.active]="isActive(item.route)"
        [title]="sidebarCollapsed ? item.label : ''">
        <div class="nav-icon">
          <i class="fas" [ngClass]="item.icon"></i>
        </div>
        <span class="nav-label">{{ item.label }}</span>
        <span class="nav-badge" *ngIf="item.badge">{{ item.badge }}</span>
        <span class="nav-badge mini" *ngIf="item.badge"></span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <img [src]="authService.getUserAvatar()" alt="Admin" class="user-avatar-sm">
        <div class="user-info-sm">
          <div class="user-name-sm">{{ authService.getUserName() }}</div>
          <div class="user-role-sm">Administrator</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── Main Content ──────────────────────────────── -->
  <div class="main-area">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-toggle" (click)="toggleSidebar(); $event.stopPropagation()">
          <i class="fas fa-bars"></i>
        </button>
        <span class="role-badge" style="background: #2563eb; color: white; padding: 4px 12px; border-radius: 8px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 900; margin-right: 12px;">Admin Portal</span>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search anything...">
        </div>
      </div>

      <div class="topbar-right">
        <!-- Notification bell -->
        <div class="topbar-action" (click)="toggleNotifications(); $event.stopPropagation()">
          <i class="fas fa-bell"></i>
          <span class="action-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>

          <div class="dropdown notif-dropdown" *ngIf="showNotifDropdown" (click)="$event.stopPropagation()">
            <div class="dropdown-header">
              <h4>Notifications</h4>
              <button class="mark-read-btn" (click)="markAllRead()">Mark all read</button>
            </div>
            <div class="dropdown-list">
              <div class="notif-item" *ngFor="let n of recentNotifications" [class.unread]="!n.isRead">
                <div class="notif-icon" [style.background]="n.color + '20'" [style.color]="n.color">
                  <i class="fas" [ngClass]="n.icon"></i>
                </div>
                <div class="notif-content">
                  <div class="notif-title">{{ n.title }}</div>
                  <div class="notif-msg">{{ n.message }}</div>
                </div>
              </div>
            </div>
            <a routerLink="/admin/notifications" class="dropdown-footer-link">View all notifications</a>
          </div>
        </div>

        <!-- Profile -->
        <div class="topbar-profile" (click)="toggleProfile(); $event.stopPropagation()">
          <img [src]="authService.getUserAvatar()" alt="Admin" class="profile-avatar">
          <span class="profile-name">{{ authService.getUserName() }}</span>
          <i class="fas fa-chevron-down"></i>

          <div class="dropdown profile-dropdown" *ngIf="showProfileDropdown" (click)="$event.stopPropagation()">
            <a routerLink="/admin/settings" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout" (click)="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <router-outlet></router-outlet>

      <footer
        style="text-align: center; padding: 16px 0 8px; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border-color); margin-top: 30px;">
        Made by <b>Noshahi Developers inc</b>
      </footer>
    </main>
    <app-confirmation-modal></app-confirmation-modal>
    <app-toast></app-toast>
  </div>
</div>
