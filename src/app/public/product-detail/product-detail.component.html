<app-site-header></app-site-header>

<main class="product-detail-page">
  <!-- Connections Plus Hero (Dynamic) -->
  <section class="product-hero" [style.backgroundImage]="'url(' + product.bgImage + ')'">
    <div class="hero-overlay"></div>
    
    <div class="content-wrapper hero-grid">
      <div class="hero-text-content">
        <h2 class="product-name-badge">{{ product.name }}</h2>
        <h1 class="hero-main-title">{{ product.heroTitle }}</h1>
        <p class="hero-subtitle">{{ product.heroSubtitle }}</p>
      </div>

      <div class="hero-form-container">
        <div class="lead-form-card">
          <h2 class="form-title">{{ product.formTitle }}</h2>
          
          <div class="form-grid">
            <div class="form-group">
              <input type="text" placeholder="First Name" class="form-control">
            </div>
            <div class="form-group">
              <input type="text" placeholder="Last Name" class="form-control">
            </div>
            <div class="form-group full-width">
              <input type="email" placeholder="Email" class="form-control">
            </div>
            <div class="form-group full-width">
              <input type="tel" placeholder="Phone" class="form-control">
            </div>
          </div>

          <p class="privacy-note">Privacy Policy</p>

          <button class="btn-claim-leads">{{ product.ctaText }}</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Placeholder for additional sections -->
  <section class="product-features" style="padding: 100px 0; background: #fff; text-align: center;">
    <div class="content-wrapper">
      <h2 style="font-size: 2.5rem; font-weight: 900; margin-bottom: 20px;">Why {{ product.name }}?</h2>
      <p style="font-size: 1.25rem; color: #64748b; max-width: 800px; margin: 0 auto;">Full product details and feature highlights coming soon.</p>
    </div>
  </section>
</main>

<app-site-footer></app-site-footer>

<!-- Floating Chat Button -->
<div class="chat-fab">
  <div class="chat-icon">
    <i class="fa fa-comment"></i>
  </div>
  <span>Chat now</span>
</div>
