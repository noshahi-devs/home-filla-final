<div class="auth-wrapper">
    <!-- Background Image with Overlay -->
    <div class="auth-bg">
        <img src="assets/luxury_real_estate_login_bg.png" alt="Luxury Real Estate">
        <div class="auth-overlay"></div>
    </div>

    <div class="auth-container">
        <!-- Back Button -->
        <a routerLink="/" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-area">
                    <div class="realtor-logo">HF</div>
                    <div class="logo-text">Home <span>Filla</span></div>
                </div>
                <h2>Create Account</h2>
                <p>Join our premium real estate community</p>
            </div>

            <form class="auth-form" (ngSubmit)="register()">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" name="name" [(ngModel)]="name" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="name@homefilla.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex: 1;">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" (click)="showPassword = !showPassword">
                                <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="confirm-password">Confirm</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirm-password" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword">
                                <i class="fas" [class.fa-eye]="!showConfirmPassword" [class.fa-eye-slash]="showConfirmPassword"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Premium Role Selection -->
                <div class="form-group" style="position: relative;">
                    <label>What would you like to do?</label>
                    <div class="role-selector-group">
                        <button type="button" class="role-btn" [class.active]="role === 'buyer'" (click)="role = 'buyer'">
                            <i class="fas fa-shopping-cart"></i> 
                            <span>Buyer</span>
                        </button>
                        <button type="button" class="role-btn" [class.active]="role === 'seller'" (click)="role = 'seller'">
                            <i class="fas fa-home"></i> 
                            <span>Seller</span>
                        </button>
                        <button type="button" class="role-btn" [class.active]="role === 'agent'" (click)="role = 'agent'">
                            <i class="fas fa-user-tie"></i> 
                            <span>Agent</span>
                        </button>
                    </div>
                </div>

                <div *ngIf="errorMessage" style="color: #ef4444; font-size: 13px; text-align: center; margin-top: 5px; padding: 12px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.2);">
                    <i class="fas fa-exclamation-circle" style="margin-right: 5px;"></i> {{ errorMessage }}
                </div>

                <button type="submit" class="auth-btn btn-primary" [disabled]="isLoading" style="position: relative; margin-top: 10px;">
                    <span *ngIf="!isLoading">Create Account</span>
                    <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Registering...</span>
                </button>

                <div class="auth-divider">
                    <span>Or sign up with</span>
                </div>

                <div class="social-auth">
                    <button type="button" class="social-btn google-btn">
                        <i class="fab fa-google"></i>
                        Google
                    </button>
                    <button type="button" class="social-btn">
                        <i class="fab fa-apple"></i>
                        Apple
                    </button>
                </div>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a routerLink="/login">Log in here</a></p>
            </div>
        </div>
    </div>
</div>
