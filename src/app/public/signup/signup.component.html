<div class="auth-wrapper">
    <!-- Background Image with Overlay -->
    <div class="auth-bg">
        <img src="assets/luxury_real_estate_login_bg.png" alt="Luxury Real Estate">
        <div class="auth-overlay"></div>
    </div>

    <div class="auth-container">
        <!-- Back Button -->
        <a routerLink="/" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <a routerLink="/" class="logo-area">
                    <svg class="hf-badge" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="hfGradAuthSignup" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <rect x="1" y="1" width="38" height="38" rx="9" fill="url(#hfGradAuthSignup)" />
                        <path d="M20 9L9 18.5h2.5V30h5.5v-6h6v6h5.5V18.5H31L20 9z" fill="white" />
                    </svg>
                    <div class="logo-wordmark">
                        <span class="logo-name">Home Filla</span>
                        <span class="logo-sub">Real Estate</span>
                    </div>
                </a>
                <h2>Create Account</h2>
                <p>Join our premium real estate community</p>
            </div>

            <form class="auth-form" (ngSubmit)="register()">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" name="name" [(ngModel)]="name" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="name@homefilla.com"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrapper phone-input-wrapper">
                        <div class="country-selector" [class.active]="isSelectorActive">
                            <img [src]="'https://flagcdn.com/w20/' + getFlag() + '.png'" [alt]="countryCode"
                                class="flag-img">
                            <input type="text" name="countryCode" [(ngModel)]="countryCode"
                                (input)="onCountryCodeInput()" (focus)="isSelectorActive = true"
                                (blur)="isSelectorActive = false" placeholder="+92" class="country-input"
                                list="countryCodes">
                            <datalist id="countryCodes">
                                <option *ngFor="let c of countries" [value]="c.dialCode">
                                    {{ c.name }}
                                </option>
                            </datalist>
                        </div>
                        <i class="fas fa-phone" style="left: 122px;"></i>
                        <input type="tel" id="phone" name="phone" [(ngModel)]="phone" (input)="onPhoneInput()"
                            placeholder="300 1234567" style="padding-left: 150px;" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex: 1;">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input [type]="showPassword ? 'text' : 'password'" id="password" name="password"
                                [(ngModel)]="password" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" (click)="showPassword = !showPassword"
                                aria-label="Toggle password visibility">
                                <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="confirm-password">Confirm</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirm-password"
                                name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="••••••••" required>
                            <button type="button" class="password-toggle"
                                (click)="showConfirmPassword = !showConfirmPassword"
                                aria-label="Toggle confirm password visibility">
                                <i class="fas" [class.fa-eye]="!showConfirmPassword"
                                    [class.fa-eye-slash]="showConfirmPassword"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Premium Role Selection -->
                <div class="form-group" style="position: relative;">
                    <label>What would you like to do?</label>
                    <div class="role-selector-group">
                        <button type="button" class="role-btn" [class.active]="role === 'buyer'"
                            (click)="role = 'buyer'">
                            <i class="fas fa-shopping-cart"></i>
                            <span>Buyer</span>
                        </button>
                        <button type="button" class="role-btn" [class.active]="role === 'seller'"
                            (click)="role = 'seller'">
                            <i class="fas fa-home"></i>
                            <span>Seller</span>
                        </button>
                        <button type="button" class="role-btn" [class.active]="role === 'agent'"
                            (click)="role = 'agent'">
                            <i class="fas fa-user-tie"></i>
                            <span>Agent</span>
                        </button>
                    </div>
                </div>

                <div *ngIf="errorMessage"
                    style="color: #ef4444; font-size: 13px; text-align: center; margin-top: 5px; padding: 12px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.2);">
                    <i class="fas fa-exclamation-circle" style="margin-right: 5px;"></i> {{ errorMessage }}
                </div>

                <button type="submit" class="auth-btn btn-primary" [disabled]="isLoading"
                    style="position: relative; margin-top: 10px;">
                    <span *ngIf="!isLoading">Create Account</span>
                    <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Registering...</span>
                </button>

            </form>

            <div class="auth-footer">
                <p>Already have an account? <a routerLink="/login">Log in here</a></p>
            </div>
        </div>
    </div>
</div>
