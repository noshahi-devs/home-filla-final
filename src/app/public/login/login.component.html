<div class="auth-wrapper">
    <!-- Background Image with Overlay -->
    <div class="auth-bg">
        <img src="assets/luxury_real_estate_login_bg.png" alt="Luxury Real Estate">
        <div class="auth-overlay"></div>
    </div>

    <div class="auth-container">
        <!-- Back Button -->
        <a routerLink="/" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <a routerLink="/" class="logo-area">
                    <svg class="hf-badge" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="hfGradAuth" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <rect x="1" y="1" width="38" height="38" rx="9" fill="url(#hfGradAuth)" />
                        <path d="M20 9L9 18.5h2.5V30h5.5v-6h6v6h5.5V18.5H31L20 9z" fill="white"/>
                    </svg>
                    <div class="logo-wordmark">
                        <span class="logo-name">Home Filla</span>
                        <span class="logo-sub">Real Estate</span>
                    </div>
                </a>
                <h2>Welcome Back</h2>
                <p>Enter your details to access your account</p>
            </div>

            <form class="auth-form" (ngSubmit)="login()">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" [(ngModel)]="email" placeholder="admin@homefilla.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" (click)="showPassword = !showPassword">
                            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe">
                        <span class="checkmark"></span>
                        <span style="user-select: none;">Remember me</span>
                    </label>
                    <a href="#" class="forgot-password" (click)="$event.preventDefault()">Forgot Password?</a>
                </div>

                <div *ngIf="successMessage" class="message success-message">
                    <i class="fas fa-check-circle"></i> {{ successMessage }}
                </div>
                <div *ngIf="errorMessage" class="message error-message">
                    <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
                </div>

                <button type="submit" class="auth-btn btn-primary" [disabled]="isLoading" style="position: relative; margin-top: 10px;">
                    <span *ngIf="!isLoading">Sign In</span>
                    <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin"></i> Authenticating...</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a routerLink="/signup">Sign up for free</a></p>
            </div>
        </div>
    </div>
</div>
